<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
  <title id="t">Reactive HPA vs forecast-driven KEDA — concept</title>
  <desc id="d">Concept illustration, not measured data. Over the same k6 traffic ramp, a reactive HPA adds pods a few minutes after demand rises, leaving a gap of under-provisioned capacity, while a forecast-driven scaler adds pods ahead of the ramp.</desc>
