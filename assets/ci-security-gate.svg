<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
  <title id="t">CI security gate</title>
  <desc id="d">A push or pull request runs the security-gate job: gitleaks, Semgrep, a conditional npm audit and Checkov. Any finding fails the job, so the validate and plan jobs never run. A planted secret is caught by gitleaks and blocks the pipeline.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a565e"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9645a"/></marker>
  </defs>
  <style>
    text{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
    .bg{fill:#161e24;}
    .box{fill:#1b242c;stroke:#2a343c;}
    .job{fill:none;stroke:#2a343c;}
    .dim{fill:#1b242c;stroke:#2a343c;opacity:.45;}
    .h{font-size:12.5px;fill:#edf1f3;font-weight:600;}
    .s{font-size:10.5px;fill:#8fa0a8;}
    .k{font-size:10px;fill:#5f6e75;}
    .lab{font-size:10px;fill:#4fbfae;}
    .ea{stroke:#4a565e;stroke-width:1.2;fill:none;marker-end:url(#a);}
    .er{stroke:#d9645a;stroke-width:1.4;fill:none;marker-end:url(#r);}
    .red{fill:#d9645a;} .redt{font-size:10.5px;fill:#d9645a;}
    .fail{fill:rgba(217,100,90,.10);stroke:#d9645a;}
  </style>
  <rect class="bg" width="760" height="400" rx="6"/>
  <text x="24" y="30" class="k">CI · BLOCKING SECURITY GATE</text>
  <text x="736" y="30" class="k" text-anchor="end">pipeline design — planted-secret scenario</text>

  <!-- trigger -->
  <rect class="box" x="24" y="128" width="96" height="58" rx="5"/>
  <text x="72" y="153" class="h" text-anchor="middle">push / PR</text>
  <text x="72" y="170" class="s" text-anchor="middle">any branch</text>
  <path class="ea" d="M120,157 H146"/>

  <!-- job 1 -->
  <rect class="job" x="150" y="48" width="262" height="246" rx="6"/>
  <text x="166" y="70" class="h">security-gate</text>
  <text x="396" y="70" class="k" text-anchor="end">job 1</text>

  <rect class="fail" x="164" y="84" width="234" height="46" rx="4"/>
  <text x="178" y="103" class="h" style="font-size:11.5px">gitleaks</text>
  <text x="178" y="120" class="redt">1 finding · aws-access-key</text>
  <text x="386" y="103" class="lab" text-anchor="end">secrets</text>
  <circle cx="380" cy="116" r="7" class="red"/><path d="M376.5,112.5 L383.5,119.5 M383.5,112.5 L376.5,119.5" stroke="#161e24" stroke-width="1.6"/>

  <rect class="box" x="164" y="138" width="234" height="46" rx="4"/>
  <text x="178" y="157" class="h" style="font-size:11.5px">semgrep</text>
  <text x="178" y="174" class="s">forecast.py · handler.py</text>
  <text x="386" y="157" class="lab" text-anchor="end">sast</text>

  <rect class="box" x="164" y="192" width="234" height="46" rx="4"/>
  <text x="178" y="211" class="h" style="font-size:11.5px">npm audit</text>
  <text x="178" y="228" class="s">skipped — no package.json</text>
  <text x="386" y="211" class="lab" text-anchor="end">sca</text>

  <rect class="box" x="164" y="246" width="234" height="38" rx="4"/>
  <text x="178" y="263" class="h" style="font-size:11.5px">checkov</text>
  <text x="178" y="277" class="s">terraform/ · no blanket skips</text>
  <text x="386" y="263" class="lab" text-anchor="end">iac</text>

  <!-- job 2 / 3 (blocked) -->
  <path class="ea" d="M412,110 H438" opacity=".45"/>
  <g opacity=".45">
    <rect class="box" x="442" y="48" width="140" height="150" rx="6"/>
    <text x="456" y="70" class="h">validate</text>
    <text x="570" y="70" class="k" text-anchor="end">job 2</text>
    <text x="456" y="98" class="s">terraform fmt</text>
    <text x="456" y="118" class="s">terraform validate</text>
    <text x="456" y="138" class="s">tflint</text>
    <text x="456" y="158" class="s">tfsec</text>
    <text x="456" y="184" class="k">needs: security-gate</text>
  </g>
  <path class="ea" d="M582,110 H608" opacity=".45"/>
  <g opacity=".45">
    <rect class="box" x="612" y="48" width="124" height="150" rx="6"/>
    <text x="626" y="70" class="h">plan</text>
    <text x="724" y="70" class="k" text-anchor="end">job 3</text>
    <text x="626" y="98" class="s">OIDC → AWS</text>
    <text x="626" y="118" class="s">no static keys</text>
    <text x="626" y="138" class="s">terraform plan</text>
    <text x="626" y="184" class="k">needs: validate</text>
  </g>
  <rect x="442" y="210" width="294" height="28" rx="4" class="fail"/>
  <text x="589" y="228" class="redt" text-anchor="middle">skipped — upstream job failed</text>

  <!-- fail path -->
  <path class="er" d="M281,294 V326"/>
  <rect class="fail" x="150" y="330" width="586" height="46" rx="5"/>
  <text x="166" y="350" class="h" style="fill:#d9645a">✗ pipeline blocked</text>
  <text x="166" y="367" class="s">any finding fails the job · SECURITY_SOFT_FAIL=true only for a demo run</text>
</svg>
