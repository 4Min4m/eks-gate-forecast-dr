# AppProject scopes what this project may deploy — allowed sources, destinations,
# and resource kinds. The RBAC boundary for GitOps.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: eks-httpbin-alb
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: HTTPBin platform and application manifests

  sourceRepos:
    - https://github.com/4Min4m/eks-gate-forecast-dr.git
    - https://prometheus-community.github.io/helm-charts
    - https://kyverno.github.io/kyverno
    - https://kedacore.github.io/charts

  destinations:
    - server: https://kubernetes.default.svc
      namespace: httpbin
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: keda

  # Monitoring operator and Kyverno install cluster-scoped CRDs/ClusterRoles.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
