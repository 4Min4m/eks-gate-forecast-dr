# The httpbin application. Argo CD auto-detects the kustomization.yaml in k8s/
# and renders it. Managed entirely from Git: change a manifest, commit, and
# Argo CD reconciles the cluster to match.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: httpbin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: eks-httpbin-alb
  source:
    repoURL: https://github.com/4Min4m/eks-gate-forecast-dr.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: httpbin
  # replicas: 2 in Git is the starting point; once KEDA (or the reactive HPA
  # baseline) scales the Deployment, Argo CD must not "heal" it back to 2.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: httpbin
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
