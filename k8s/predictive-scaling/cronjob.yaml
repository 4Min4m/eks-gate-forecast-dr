# Runs the forecaster every 5 minutes. A CronJob (not a Deployment/sidecar)
# on purpose: the workload is a short batch computation, not a long-lived
# service, and a CronJob keeps the whole POC in-cluster with no extra Lambda
# or ECS infra to stand up.
#
# Passes every Kyverno policy enforced on the httpbin namespace (non-root,
# read-only root filesystem, CPU + memory limits, no privilege escalation,
# pinned tags). The public python image has no boto3, so an init container
# pip-installs a pinned boto3 into a shared emptyDir (--target) and the main
# container imports it via PYTHONPATH — no writes to the image filesystem,
# no custom image build/push/ECR step. For anything longer-lived you'd bake
# a real image instead of installing at run time.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: predictive-scaler
  namespace: httpbin
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            app.kubernetes.io/name: predictive-scaler
        spec:
          serviceAccountName: predictive-scaler
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: install-deps
              image: python:3.12-slim
              command: ["pip", "install", "--quiet", "--no-cache-dir", "--target", "/deps", "boto3==1.43.100"]
              env:
                - name: HOME
                  value: /tmp
                - name: PIP_DISABLE_PIP_VERSION_CHECK
                  value: "1"
              volumeMounts:
                - name: deps
                  mountPath: /deps
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          containers:
            - name: forecaster
              image: python:3.12-slim
              command: ["python", "/scripts/forecast.py"]
              env:
                - name: PYTHONPATH
                  value: /deps
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: HOME
                  value: /tmp
                - name: AWS_REGION
                  value: "us-east-1"
                - name: ALB_NAME
                  value: "httpbin-public-alb"
                - name: CUSTOM_METRIC_NAMESPACE
                  value: "httpbin/predictive-scaling"
                - name: CUSTOM_METRIC_NAME
                  value: "DesiredReplicas"
                - name: REQUESTS_PER_POD_PER_MINUTE
                  value: "300" # CHANGE-ME once you've load-tested your own pod capacity
                - name: MIN_REPLICAS
                  value: "2"
                - name: MAX_REPLICAS
                  value: "20"
                - name: HORIZON_MINUTES
                  value: "10"
                # 60 for the reactive-vs-proactive demo (the HPA-baseline run
                # an hour earlier is the "history"); 1440 for a real daily cycle.
                - name: SEASONAL_PERIOD_MINUTES
                  value: "60"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: deps
                  mountPath: /deps
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: script
              configMap:
                name: predictive-scaler-script
            - name: deps
              emptyDir:
                sizeLimit: 200Mi
            - name: tmp
              emptyDir:
                sizeLimit: 50Mi
