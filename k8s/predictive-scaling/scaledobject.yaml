# TriggerAuthentication tells KEDA to use the KEDA operator's own IRSA
# identity (pod identity) rather than static keys — same "no long-lived
# credentials" principle as everything else in this platform.
# `provider: aws` with identityOwner `keda` = use the KEDA operator's IRSA
# role (keda.yaml). The older `aws-eks` provider is deprecated.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-trigger-auth-aws
  namespace: httpbin
spec:
  podIdentity:
    provider: aws
    identityOwner: keda
---
# Scales the httpbin Deployment off the forecast metric the CronJob
# publishes, instead of off live load — the actual mechanism under test in
# this POC. targetMetricValue: "1" is a deliberate trick: the CronJob
# already computes a *desired replica count* (not a raw request rate) and
# publishes that as the metric value, so a target of 1 means "the metric
# value IS the desired replica count" — KEDA doesn't need its own
# rate-to-replica math.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: httpbin-predictive
  namespace: httpbin
spec:
  scaleTargetRef:
    name: httpbin
  minReplicaCount: 2
  maxReplicaCount: 20
  cooldownPeriod: 120
  pollingInterval: 30
  triggers:
    - type: aws-cloudwatch
      authenticationRef:
        name: keda-trigger-auth-aws
      metadata:
        namespace: "httpbin/predictive-scaling"
        metricName: "DesiredReplicas"
        dimensionName: "Service"
        dimensionValue: "httpbin"
        # Read the newest 1-minute datapoint from the last 10 minutes. The
        # CronJob publishes every 5 minutes, so a 10-minute window always
        # holds its latest value (KEDA uses the newest point returned).
        metricStat: "Maximum"
        metricStatPeriod: "60"
        metricCollectionTime: "600"
        metricEndTimeOffset: "0"
        targetMetricValue: "1"
        # Used only if no datapoint is found (e.g. the CronJob is failing):
        # fall back to the floor rather than scaling to zero.
        minMetricValue: "2"
        awsRegion: "us-east-1"
