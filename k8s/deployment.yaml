# Deployment for HTTPBin with 2 replicas for HA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: httpbin
  labels:
    app.kubernetes.io/name: httpbin
    app.kubernetes.io/part-of: eks-httpbin-alb
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: httpbin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: httpbin
    spec:
      # This app never talks to the Kubernetes API — don't mount a token.
      automountServiceAccountToken: false
      # Pod-level hardening.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          # 'required' guarantees the two replicas never share a node,
          # so a single node failure can't take out the whole app.
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: httpbin
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: httpbin
        # Maintained, semver-pinned port of httpbin. Runs as non-root
        # (distroless) from v2.19.0 and listens on 8080 by default.
        image: mccutchen/go-httpbin:v2.19.0
        ports:
        - containerPort: 8080
          name: http
        # Container-level hardening.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /status/200
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /status/200
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
