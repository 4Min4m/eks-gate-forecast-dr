apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: {{ .Values.nodeRole | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.discoveryTag | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.discoveryTag | quote }}
  tags:
    karpenter.sh/discovery: {{ .Values.discoveryTag | quote }}
    kubernetes.io/cluster/{{ .Values.clusterName }}: owned
